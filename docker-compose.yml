    environment: { <<: *backend-env, EVIDENCE_SERVICE_PORT: "3012" }
    depends_on: *backend-depends
    ports: ["3012:3012"]
    networks: [dpo-net]

  gateway-api:
    build: { context: ., dockerfile: docker/backend.Dockerfile, args: { SERVICE: gateway-api } }
    environment:
      GATEWAY_PORT: "3000"
      AUTH_SERVICE_URL: http://auth-service:3001
      CONSENT_SERVICE_URL: http://consent-service:3002
      RAT_SERVICE_URL: http://rat-service:3003
      ARCO_SERVICE_URL: http://arco-service:3004
      BREACH_SERVICE_URL: http://breach-service:3005
      RETENTION_SERVICE_URL: http://retention-service:3006
      ETHICS_SERVICE_URL: http://ethics-service:3007
      MATURITY_SERVICE_URL: http://maturity-service:3008
      TRAINING_SERVICE_URL: http://training-service:3009
      CONTRACTS_SERVICE_URL: http://contracts-service:3010
      AUDIT_SERVICE_URL: http://audit-service:3011
      EVIDENCE_SERVICE_URL: http://evidence-service:3012
    depends_on:
      - auth-service
      - consent-service
      - rat-service
      - arco-service
      - breach-service
      - retention-service
      - ethics-service
      - maturity-service
      - training-service
      - contracts-service
      - audit-service
      - evidence-service
    ports: ["3000:3000"]
    networks: [dpo-net]

  # ---------------------------------------------------------------------
  # Frontend — shell (host) + módulos independientes (remotes)
  # Cada uno se compila y despliega como un contenedor Nginx separado.
  # ---------------------------------------------------------------------
  shell:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        MODULE_PATH: frontend/shell
        # PUBLIC_HOST = IP pública o dominio del servidor donde corre esto
        # (ver .env: sin él, el shell compilado apuntaría a "localhost",
        # que en el navegador del usuario final no resuelve al servidor).
        VITE_API_BASE_URL: http://${PUBLIC_HOST:-localhost}:3000/api
        VITE_REMOTE_COMPANIES_USERS: http://${PUBLIC_HOST:-localhost}:5175/assets/remoteEntry.js
        VITE_REMOTE_CONSENTS: http://${PUBLIC_HOST:-localhost}:5176/assets/remoteEntry.js
        VITE_REMOTE_RAT: http://${PUBLIC_HOST:-localhost}:5177/assets/remoteEntry.js
        VITE_REMOTE_ARCO: http://${PUBLIC_HOST:-localhost}:5178/assets/remoteEntry.js
        VITE_REMOTE_BREACHES: http://${PUBLIC_HOST:-localhost}:5179/assets/remoteEntry.js
        VITE_REMOTE_RETENTION: http://${PUBLIC_HOST:-localhost}:5180/assets/remoteEntry.js
        VITE_REMOTE_ETHICS_CHANNEL: http://${PUBLIC_HOST:-localhost}:5181/assets/remoteEntry.js
        VITE_REMOTE_MATURITY: http://${PUBLIC_HOST:-localhost}:5182/assets/remoteEntry.js
        VITE_REMOTE_TRAINING: http://${PUBLIC_HOST:-localhost}:5183/assets/remoteEntry.js
        VITE_REMOTE_CONTRACTS: http://${PUBLIC_HOST:-localhost}:5184/assets/remoteEntry.js
        VITE_REMOTE_AUDIT: http://${PUBLIC_HOST:-localhost}:5185/assets/remoteEntry.js
        VITE_REMOTE_EVIDENCE: http://${PUBLIC_HOST:-localhost}:5186/assets/remoteEntry.js
    ports: ["5173:80"]
    networks: [dpo-net]

  module-companies-users:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        MODULE_PATH: frontend/modules/companies-users
        VITE_API_BASE_URL: http://${PUBLIC_HOST:-localhost}:3000/api
    ports: ["5175:80"]
    networks: [dpo-net]

  module-consents:
