x-backend-env: &backend-env
  NODE_ENV: production
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-dpo_platform}
  POSTGRES_USER: ${POSTGRES_USER:-dpo_admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
  POSTGRES_SSL: "false"
  JWT_SECRET: ${JWT_SECRET:-change_me_super_secret}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}

x-backend-depends: &backend-depends
  postgres:
    condition: service_healthy

services:
  # ---------------------------------------------------------------------
  # Base de datos — para producción en Hostinger, sustituir por la cadena
  # de conexión de su PostgreSQL administrado (ver .env y README).
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dpo_platform}
      POSTGRES_USER: ${POSTGRES_USER:-dpo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dpo_admin}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [dpo-net]

  # Aplica db/init y db/migrations/* una sola vez y termina.
  migrate:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args: { SERVICE: gateway-api }
    entrypoint: ["node", "scripts/migrate.js"]
    environment: *backend-env
    depends_on: *backend-depends
    networks: [dpo-net]

  # ---------------------------------------------------------------------
  # Microservicios backend
  # ---------------------------------------------------------------------
  auth-service:
    build: { context: ., dockerfile: docker/backend.Dockerfile, args: { SERVICE: auth-service } }
    environment: { <<: *backend-env, AUTH_SERVICE_PORT: "3001" }
    depends_on: *backend-depends
    ports: ["3001:3001"]
    networks: [dpo-net]

  consent-service:
    build: { context: ., dockerfile: docker/backend.Dockerfile, args: { SERVICE: consent-service } }
    environment: { <<: *backend-env, CONSENT_SERVICE_PORT: "3002" }
    depends_on: *backend-depends
    ports: ["3002:3002"]
    networks: [dpo-net]

  rat-service:
    build: { context: ., dockerfile: docker/backend.Dockerfile, args: { SERVICE: rat-service } }
    environment: { <<: *backend-env, RAT_SERVICE_PORT: "3003" }
    depends_on: *backend-depends
    ports: ["3003:3003"]
    networks: [dpo-net]

  arco-service:
    build: { context: ., dockerfile: docker/backend.Dockerfile, args: { SERVICE: arco-service } }
    environment: { <<: *backend-env, ARCO_SERVICE_PORT: "3004" }
    depends_on: *backend-depends
    ports: ["3004:3004"]
    networks: [dpo-net]

  breach-service:
    build: { context: ., dockerfile: docker/backend.Dockerfile, args: { SERVICE: breach-service } }
    environment: { <<: *backend-env, BREACH_SERVICE_PORT: "3005" }
    depends_on: *backend-depends
    ports: ["3005:3005"]
    networks: [dpo-net]

  retention-service:
    build: { context: ., dockerfile: docker/backend.Dockerfile, args: { SERVICE: retention-service } }
    environment: { <<: *backend-env, RETENTION_SERVICE_PORT: "3006" }
    depends_on: *backend-depends
    ports: ["3006:3006"]
    networks: [dpo-net]

  ethics-service:
    build: { context: ., dockerfile: docker/backend.Dockerfile, args: { SERVICE: ethics-service } }
    environment: { <<: *backend-env, ETHICS_SERVICE_PORT: "3007" }
