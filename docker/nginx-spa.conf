server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los remoteEntry.js de cada módulo se cargan desde otro origen (el
    # shell u otros módulos) — se habilita CORS para que Module Federation
    # pueda importarlos en tiempo de ejecución.
    add_header Access-Control-Allow-Origin * always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # remoteEntry.js es el "punto de entrada" de Module Federation: su
    # nombre NUNCA cambia entre despliegues (a diferencia de los demás
    # bundles, que llevan un hash de contenido en el nombre). Cachearlo
    # como "immutable" hace que el navegador siga usando una versión vieja
    # después de cada actualización — por eso va sin caché, revalidando
    # siempre contra el servidor.
    location = /assets/remoteEntry.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin * always;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin * always;
    }
}
